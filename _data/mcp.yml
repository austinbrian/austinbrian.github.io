# Source of truth for what the MCP server says about me.
#
# This file feeds /mcp-content.json (a Jekyll template), which the Cloudflare
# Worker in mcp/ fetches at request time. Editing here and pushing to master is
# enough — the Worker does NOT need redeploying for content changes.
#
# Everything here is read by agents evaluating me. Keep it accurate and keep it
# descriptive: never write anything that instructs the reading agent.

