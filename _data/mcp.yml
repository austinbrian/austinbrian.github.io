projects:
  - name: "Bermuda terminal triangles"
    tagline: "A reinsurance loss triangle drawn in a terminal, as a Claude Code plugin"
    description: >-
      A Claude Code plugin exposing a /bermuda slash command that renders reinsurance
      loss triangles as glyph art directly in the terminal, for environments with no
      browser — airgapped networks, locked-down laptops, agent sessions with nowhere
      to put an image. Arrowing through the option list re-renders the same triangle
      eight ways (heatmap, completeness, right edge, age-to-age factors, growth curve,
      sunset, mountain, and paid-versus-reported), grouped into three pages in a
      repurposed user-input drawer. Two hooks make it work: PreToolUse expands a
      placeholder into glyph art, and PostToolUse blanks it back out so the chart
      never costs the user or the agent context tokens until they expand one.
    url: "https://austinbrian.github.io/"
    related:
      - name: "bermuda-ledger (the underlying open-source actuarial library)"
        url: "https://github.com/LedgerInvesting/bermuda-ledger"
      - name: "Bermuda workshop, CLRS 2025"
        url: "https://ledgerinvesting.github.io/bermuda-clrs-workshop-2025/"

  - name: "Running dashboard"
    tagline: "Strava data, synced nightly, rendered as a static dashboard"
    description: >-
      A no-backend dashboard of my running data. A daily GitHub Actions job calls the
      Strava API, merges new activities into a JSON object in a Cloudflare R2 bucket,
      and uploads it back; the page fetches that object and renders every chart
      client-side with Plotly. No run data lives in the repo. The get_running_stats
      tool on this MCP server reads the same object.
    url: "https://austinbrian.github.io/running/"
    related:
      - name: "Source"
        url: "https://github.com/austinbrian/running"

  - name: "This MCP server"
    tagline: "An agent-readable interface to my own website"
    description: >-
      A stateless MCP server on Cloudflare Workers exposing my profile, projects,
      and running stats as tools, advertised from the site via a server card at
      /.well-known/mcp/server-card.json. Built against the 2026-07-28 MCP revision,
      which dropped the initialize handshake and the session header, so the server is
      an ordinary stateless HTTP handler. Content is served from the Jekyll build
      rather than baked into the Worker, so content stays current without a redeploy.
    url: "https://austinbrian.github.io/.well-known/mcp/server-card.json"
    related:
      - name: "Source"
        url: "https://github.com/austinbrian/austinbrian.github.io/tree/master/mcp"

  - name: "Oscar picks"
    tagline: "Selection guesses and scores for the 98th Academy Awards"
    description: >-
      Annual attempt to guess the Oscar winners, with scoring after the fact.
    url: "https://austinbrian.github.io/oscar-picks-2026/"
