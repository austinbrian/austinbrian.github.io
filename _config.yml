# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.author }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Brian Austin
author: Brian Austin
description: Long on data science. The website and portfolio page of Brian Austin.
baseurl: "" # must be an explicit empty string; a nil value lets jekyll-github-metadata guess a subpath
url: "https://austinbrian.github.io" # the base hostname & protocol for your site, e.g. http://example.com
lang: en
timezone: EST
# Required by jekyll-github-metadata when building outside the legacy Pages builder
repository: austinbrian/austinbrian.github.io
exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - LICENSE.txt
  - CHANGELOG.md
  - jekyll-whiteglass.gemspec
  - screenshot.png
  - vendor
  # Working files and old experiments — kept in the repo, not published
  - SITE_REFRESH_PLAN.md
  - analyses
  - browser.txt
  - drafts
  - get_strava_token.py
  - index4.html
  - strava_data.db
  - style4.css
  - testfile.py
  - token.sh
  - Untitled.ipynb


# Social media
twitter_username: bda
github_username: austinbrian
linkedin_username: briandaustin
twitter_image:
github_image:
facebook_app_id:
facebook_image:

# Plugins
plugins:
  - jekyll-archives
  - jekyll-sitemap

# Build settings
markdown: kramdown
excerpt_separator: "<!-- more -->"

# Outputting
permalink: /:title/

# Markdown settings
kramdown:
  auto_ids: false
  enable_coderay: false
  entity_output: as_char
  footnote_nr: 1
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  toc_levels: 1..6

# jekyll-archives
jekyll-archives:
  enabled:
    - categories
  layout: category_archives
  permalinks:
    category: /categories/:name/
