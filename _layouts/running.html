---
layout: default
---

<div class="running-dashboard">
  <h1>{{ page.title }}</h1>
  {{ content }}

  <!-- Tab Navigation -->
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="cumulative">Cumulative Data</button>
    <button class="tab-btn" data-tab="runs">Individual Runs</button>
    <button class="tab-btn" data-tab="pace">Pace Analysis</button>
  </div>

  <div id="dashboard-content">

    <!-- Tab 1: Cumulative Data -->
    <div class="tab-panel" data-tab="cumulative">
      <div class="controls">
        <label>Start: <input type="date" id="cumulative-start"></label>
        <label>End: <input type="date" id="cumulative-end"></label>
        <label>Target:
          <input type="range" id="target-slider" min="0" max="8000" step="500" value="1000">
          <span id="target-value">1,000</span> miles
        </label>
      </div>
      <div id="info-boxes" class="info-boxes"></div>
      <div id="cumulative-chart" class="chart-container"></div>
    </div>

    <!-- Tab 2: Individual Runs -->
    <div class="tab-panel" data-tab="runs" style="display:none">
      <div class="controls">
        <label>Start: <input type="date" id="runs-start"></label>
        <label>End: <input type="date" id="runs-end"></label>
        <label>Quick:
          <select id="runs-quick-range">
            <option value="">--</option>
            <option value="ytd" selected>Year to Date</option>
            <option value="1y">Last 1 Year</option>
            <option value="2y">Last 2 Years</option>
            <option value="2020">Since 2020</option>
          </select>
        </label>
        <label class="radio-group">
          Size by:
          <label><input type="radio" name="size-by" value="distance" checked> Distance</label>
          <label><input type="radio" name="size-by" value="elevation"> Elevation</label>
        </label>
      </div>
      <div id="weekly-runs-container"></div>
    </div>

    <!-- Tab 3: Pace Analysis -->
    <div class="tab-panel" data-tab="pace" style="display:none">
      <div class="controls">
        <label>Start: <input type="date" id="pace-start"></label>
        <label>End: <input type="date" id="pace-end"></label>
        <label>Quick:
          <select id="pace-quick-range">
            <option value="">--</option>
            <option value="ytd" selected>Year to Date</option>
            <option value="1y">Last 1 Year</option>
            <option value="2y">Last 2 Years</option>
            <option value="2020">Since 2020</option>
          </select>
        </label>
        <label class="radio-group">
          X-axis:
          <label><input type="radio" name="pace-x-axis" value="distance" checked> Distance</label>
          <label><input type="radio" name="pace-x-axis" value="date"> Date</label>
        </label>
      </div>
      <div id="pace-chart" class="chart-container"></div>
      <div id="pace-distribution" class="chart-container"></div>
    </div>

  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>
  <script>
    // Set R2 data URL — update this after creating your R2 bucket
    const R2_DATA_URL = '{{ site.r2_data_url | default: "https://strava-data.austinbrian.workers.dev/activities.json" }}';
  </script>
  <script src="{{ "/assets/js/running-dashboard.js" | relative_url }}"></script>
</div>

<style>
.running-dashboard {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.tab-nav {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border-bottom: 2px solid #eee;
}

.tab-btn {
  padding: 10px 20px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 16px;
  color: #666;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.2s, border-color 0.2s;
}

.tab-btn:hover {
  color: #333;
}

.tab-btn.active {
  color: #FC4C02;
  border-bottom-color: #FC4C02;
  font-weight: bold;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: center;
  margin-bottom: 20px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 8px;
}

.controls label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.controls input[type="date"] {
  padding: 4px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.controls select {
  padding: 4px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.radio-group {
  display: flex;
  gap: 10px;
  align-items: center;
}

.radio-group label {
  font-weight: normal;
}

.info-boxes {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.info-box {
  flex: 1;
  min-width: 200px;
  padding: 15px;
  border: 1px solid #eee;
  border-radius: 8px;
  text-align: center;
}

.info-box h4 {
  margin: 0 0 10px 0;
  color: #FC4C02;
}

.info-box p, .info-box div {
  margin: 5px 0;
  font-size: 14px;
}

.chart-container {
  width: 100%;
  min-height: 400px;
  margin: 20px 0;
}

.week-row hr {
  margin: 20px 0;
  border-color: #E5E5E5;
}

.week-chart-wrapper {
  display: flex;
  width: 100%;
  align-items: center;
}

.week-chart {
  width: 90%;
  height: 150px;
}

.week-summary {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-left: 10px;
  min-width: 80px;
}

.summary-number {
  font-size: 24px;
  font-weight: bold;
  color: #000080;
  text-align: center;
}

.summary-unit {
  font-size: 16px;
  color: #000080;
  text-align: center;
}

.error {
  color: #721c24;
  background-color: #f8d7da;
  border: 1px solid #f5c6cb;
  padding: 15px;
  border-radius: 4px;
  margin: 10px 0;
}

#target-slider {
  width: 150px;
}
</style>
